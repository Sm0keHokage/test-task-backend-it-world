services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments"]
      interval: 5s
      timeout: 5s
      retries: 10

  rates:
    build: ./rates_service
    ports:
      - "8011:8001"

  web:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://payments:payments@db:5432/payments
      RATES_SERVICE_URL: http://rates:8001
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8010:8000"
    volumes:
      - .:/app

volumes:
  pgdata: